    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; }

        nav a { color: #fff; text-decoration: none; padding: 15px 25px; font-weight: bold; text-transform: uppercase; }

            max-width: 800px; 
            margin: 30px auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 10px; 
            text-align: center; /* Centra la imagen y textos */
        }

        /* Estilo para la foto de perfil */
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%; /* Hace la foto circular */
            object-fit: cover;
            border: 4px solid #3498db;
            margin-bottom: 20px;
        }

        .bio-text {
            text-align: left; /* Mantiene el texto descriptivo alineado a la izquierda */

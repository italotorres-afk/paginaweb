<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Motos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8f0f2;
            color: #243447;
            margin: 0;
        }

        header {
            background: #0b3954;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 38px;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px 20px;
            flex-wrap: wrap;
        }

        .moto {
            background: white;
            width: 400px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px #0002;
        }

        .moto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .contenido {
            padding: 25px;
        }

        .contenido h2 {
            color: #0b3954;
        }

        .contenido p {
            line-height: 1.6;
        }

        .boton {
            display: inline-block;
            background: #f28f3b;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
        }

        footer {
            background: #0b3954;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {
            .moto {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🏍️ Galería de Motos</h1>
        <p>Conoce nuestras motocicletas</p>
    </header>

    <main class="galeria">

        <article class="moto">
            <img src="imagenes/moto1.jpg" alt="Moto deportiva">

            <div class="contenido">
                <h2>Moto Deportiva</h2>

                <p>
                    Motocicleta potente y moderna,
                    ideal para los amantes de la velocidad.
                </p>

                <a href="#" class="boton">Ver detalles</a>
            </div>
        </article>

        <article class="moto">
            <img src="imagenes/moto2.jpg" alt="Moto moderna">

            <div class="contenido">
                <h2>Moto Moderna</h2>

                <p>
                    Diseño elegante y comodidad
                    para disfrutar cada viaje.
                </p>

                <a href="#" class="boton">Ver detalles</a>
            </div>
        </article>

    </main>

    <footer>
        <p>© 2026 Galería de Motos</p>
    </footer>

</body>
</html>
